version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: project-service-postgres
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=projectuser
      - POSTGRES_PASSWORD=projectpass
      - POSTGRES_DB=projectdb
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U projectuser -d projectdb']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  project-service-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: project-service-dev
    ports:
      - '3001:3001'
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:delegated
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./.env:/app/.env:ro
      # Use named volumes for node_modules to avoid conflicts
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
    command: pnpm dev:container
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  project-service-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-service-prod
    ports:
      - '3002:3001'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - production

volumes:
  node_modules:
  postgres_data:
